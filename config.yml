strategies:
  - pullback
  - breakout

basket:
  - QQQ
  - SPY
  - GLD
  - BNO
  - EWU
  - EWJ


symbols:
  - QQQ
  - SPY
  - GLD
  - BNO
  - EWU
  - EWJ



# Sweep configuration -- v4: trail × rsi grid on 1h QQQ loose
modes:
  - loose

timeframes:
  - 1hour
  - 15min




# Trail-stop variants to sweep
trail_types:
  - atr_2.5




# RSI cross-up thresholds to sweep
rsi_thresholds:
  - 40

# Leverage sweep -- consistency check, 1x only
margins:
  - 0.2       # IG ETF margin requirement (20%) -- this is what proper IG sizing requires.
              # margin=1.0 was underbuying because backtesting.py treats it as cash equity:
              # affordability cap (95% of cash) clipped position size, so real risk per trade
              # ended up much smaller than risk_pct intended. margin=0.2 matches IG behaviour.
              # Add 0.1 (10x) for an aggressive test if drawdowns stay tame.




# QQQ Trend-Pullback Backtest -- ETF vs futures consistency check

data:
  symbol: QQQ
  start_date: 2022-01-01
  end_date: today
  timeframe: 1hour
  cache_max_age_hours: 24

period:
  train_end: 2024-12-31
  holdout_start: 2025-01-01

breakout:
  donchian_periods: [10, 21, 55]
  trail_atr_mults: [1.5, 2.0, 2.5, 3.0]
  consolidation_methods: ["consolidation_atr", "consolidation_bb"]
  atr_contraction_ratio: 0.75
  atr_short: 14
  atr_long: 50
  bb_period: 20
  bb_num_std: 2.0
  bb_lookback: 120
  bb_percentile: 0.20
  bb_percentiles: [0.20, 0.30, 0.40]
  volume_multiplier: 1.5
  volume_lookback: 20
  require_volume: false

strategy:
  eod_force_close_utc: "21:30"
  eod_block_entries_after_utc: "19:30"
  regime_filter_4h: false
  daily_filter_mode: strict
  daily:
    fast_ema: 50
    slow_ema: 200
    short_ema: 21
    medium_ema: 100
    donchian_low: 20
    daily_atr_period: 14
    zone_proximity_atr_mult: 0.5
    zone_lookback_bars: 6
  hourly:
    rsi_period: 14
    rsi_threshold: 35
    atr_period: 14
    atr_multiplier_stop: 1.0
    trail_ema: 21
    take_partial_at_R: 2.0
    partial_exit_pct: 50

costs:
  spread: 0.5           # absolute price units round-trip -- IG ETF spread bet, mid-range estimate (live varies 0.5-1.5)
  commission: 0.0
  slippage_ticks: 1
  tick_size: 0.01

execution:
  one_position_at_a_time: true
  no_pyramiding: true
  initial_capital: 10000          # GBP/USD baseline -- 1% risk_pct on this gives £100/trade risk
  risk_pct: 0.01

# When running via the entrypoint, both modes are executed.
modes:
  - strict
  - loose


# -----------------------------------------------------------------------------
# Portfolios
# -----------------------------------------------------------------------------
# Named combinations of (symbol, timeframe, variant_label) that get
# equal-weighted into a single portfolio equity curve. Each member must
# correspond to a variant the main sweep produces.
portfolios:
  best_return:
    description: "Highest holdout return per symbol -- 6 ETFs"
    members:
      - {symbol: GLD, tf: 15min, label: pullback_atr_2.5_rsi40_tiered}
      - {symbol: EWJ, tf: 15min, label: pullback_atr_2.5_rsi40_tiered}
      - {symbol: BNO, tf: 15min, label: breakout_d21_bb40_atr3.0}
      - {symbol: QQQ, tf: 1hour, label: pullback_atr_2.5_rsi40_legacy50}
      - {symbol: EWU, tf: 15min, label: breakout_d55_bb40_atr3.0}
      - {symbol: SPY, tf: 1hour, label: pullback_atr_2.5_rsi40_legacy50}

  best_risk_adjusted:
    description: "Highest holdout return / |MaxDD| per symbol -- 6 ETFs"
    members:
      - {symbol: GLD, tf: 15min, label: breakout_d10_bb40_atr3.0}
      - {symbol: EWJ, tf: 15min, label: pullback_atr_2.5_rsi40_tiered}
      - {symbol: BNO, tf: 15min, label: breakout_d21_bb40_atr3.0}
      - {symbol: QQQ, tf: 1hour, label: breakout_d10_bb40_atr2.0}
      - {symbol: EWU, tf: 15min, label: breakout_d55_bb40_atr3.0}
      - {symbol: SPY, tf: 1hour, label: breakout_d10_bb40_atr2.5}
