strategies:
  - pullback
  - breakout

basket:
  - QQQ
  - SPY
  - GLD
  - BNO
  - NQUSD
  - ESUSD
  - GCUSD
  - BZUSD


symbols:
  - QQQ
  - SPY
  - GLD
  - BNO
  - NQUSD
  - ESUSD
  - GCUSD
  - BZUSD



# Sweep configuration -- v4: trail × rsi grid on 1h QQQ loose
modes:
  - loose

timeframes:
  - 1hour
  - 15min




# Trail-stop variants to sweep
trail_types:
  - atr_2.5




# RSI cross-up thresholds to sweep
rsi_thresholds:
  - 40

# Leverage sweep -- consistency check, 1x only
margins:
  - 1.0       # 1x baseline -- no leverage scan this run




# QQQ Trend-Pullback Backtest -- ETF vs futures consistency check

data:
  symbol: QQQ
  start_date: 2022-01-01
  end_date: today
  timeframe: 1hour
  cache_max_age_hours: 24

period:
  train_end: 2024-12-31
  holdout_start: 2025-01-01

breakout:
  donchian_periods: [10, 21, 55]
  trail_atr_mults: [1.5, 2.0, 2.5, 3.0]
  consolidation_methods: ["consolidation_atr", "consolidation_bb"]
  atr_contraction_ratio: 0.75
  atr_short: 14
  atr_long: 50
  bb_period: 20
  bb_num_std: 2.0
  bb_lookback: 120
  bb_percentile: 0.20
  bb_percentiles: [0.20, 0.30, 0.40]
  volume_multiplier: 1.5
  volume_lookback: 20
  require_volume: false

strategy:
  eod_force_close_utc: "21:30"
  eod_block_entries_after_utc: "19:30"
  regime_filter_4h: false
  daily_filter_mode: strict
  daily:
    fast_ema: 50
    slow_ema: 200
    short_ema: 21
    medium_ema: 100
    donchian_low: 20
    daily_atr_period: 14
    zone_proximity_atr_mult: 0.5
    zone_lookback_bars: 6
  hourly:
    rsi_period: 14
    rsi_threshold: 35
    atr_period: 14
    atr_multiplier_stop: 1.0
    trail_ema: 21
    take_partial_at_R: 2.0
    partial_exit_pct: 50

costs:
  spread: 0.01
  commission: 0.0
  slippage_ticks: 1
  tick_size: 0.01

execution:
  one_position_at_a_time: true
  no_pyramiding: true
  initial_capital: 10000
  risk_pct: 0.01

# When running via the entrypoint, both modes are executed.
modes:
  - strict
  - loose


# -----------------------------------------------------------------------------
# Portfolios -- ETF vs Futures consistency check
# -----------------------------------------------------------------------------
portfolios:
  etf_pullback_15min:
    description: "ETFs (QQQ/SPY/GLD/BNO) on 15min pullback tiered"
    members:
      - {symbol: QQQ, tf: 15min, label: pullback_atr_2.5_rsi40_tiered}
      - {symbol: SPY, tf: 15min, label: pullback_atr_2.5_rsi40_tiered}
      - {symbol: GLD, tf: 15min, label: pullback_atr_2.5_rsi40_tiered}
      - {symbol: BNO, tf: 15min, label: pullback_atr_2.5_rsi40_tiered}

  futures_pullback_15min:
    description: "Futures (NQUSD/ESUSD/GCUSD/BZUSD) on 15min pullback tiered"
    members:
      - {symbol: NQUSD, tf: 15min, label: pullback_atr_2.5_rsi40_tiered}
      - {symbol: ESUSD, tf: 15min, label: pullback_atr_2.5_rsi40_tiered}
      - {symbol: GCUSD, tf: 15min, label: pullback_atr_2.5_rsi40_tiered}
      - {symbol: BZUSD, tf: 15min, label: pullback_atr_2.5_rsi40_tiered}

  etf_breakout_15min:
    description: "ETFs on 15min breakout d10 bb40 atr3.0"
    members:
      - {symbol: QQQ, tf: 15min, label: breakout_d10_bb40_atr3.0}
      - {symbol: SPY, tf: 15min, label: breakout_d10_bb40_atr3.0}
      - {symbol: GLD, tf: 15min, label: breakout_d10_bb40_atr3.0}
      - {symbol: BNO, tf: 15min, label: breakout_d10_bb40_atr3.0}

  futures_breakout_15min:
    description: "Futures on 15min breakout d10 bb40 atr3.0"
    members:
      - {symbol: NQUSD, tf: 15min, label: breakout_d10_bb40_atr3.0}
      - {symbol: ESUSD, tf: 15min, label: breakout_d10_bb40_atr3.0}
      - {symbol: GCUSD, tf: 15min, label: breakout_d10_bb40_atr3.0}
      - {symbol: BZUSD, tf: 15min, label: breakout_d10_bb40_atr3.0}
