strategies:
  - pullback
  - breakout

basket:
  - QQQ
  - SPY
  - GLD
  - BNO
  - EWU
  - EWJ


symbols:
  - QQQ
  - SPY
  - GLD
  - BNO
  - EWU
  - EWJ



# Sweep configuration -- v4: trail × rsi grid on 1h QQQ loose
modes:
  - loose

timeframes:
  - 1hour
  - 15min




# Trail-stop variants to sweep
trail_types:
  - atr_2.5




# RSI cross-up thresholds to sweep
rsi_thresholds:
  - 40

# Leverage sweep (margin = required cash %; 1.0=cash, 0.5=2x, 0.33=3x)
margins:
  - 1.0      # 1x baseline for v9 strategy comparison






# QQQ Trend-Pullback Backtest v4 -- trail × rsi sweep on 1h loose

data:
  symbol: QQQ
  start_date: 2022-01-01
  end_date: today              # special string parsed at runtime
  timeframe: 1hour             # FMP timeframe
  cache_max_age_hours: 24

period:
  train_end: 2024-12-31
  holdout_start: 2025-01-01

breakout:
  donchian_periods: [10, 21, 55]
  trail_atr_mults: [1.5, 2.0, 2.5, 3.0]
  consolidation_methods: ["consolidation_atr", "consolidation_bb"]
  atr_contraction_ratio: 0.75
  atr_short: 14
  atr_long: 50
  bb_period: 20
  bb_num_std: 2.0
  bb_lookback: 120
  bb_percentile: 0.20
  volume_multiplier: 1.5
  volume_lookback: 20
  require_volume: false   # turned off — Donchian + consolidation only

strategy:
  # Day-trade structure: force close before IG financing cutoff (22:00 UK), block late entries
  eod_force_close_utc: "21:30"     # close any open position at/after this UTC time
  eod_block_entries_after_utc: "19:30"   # don't take new setups after this UTC
  regime_filter_4h: false   # gate 1h entries on 4h close > 4h 200 EMA
  daily_filter_mode: strict   # default for single-mode runs; the entrypoint loops over both
  daily:
    fast_ema: 50
    slow_ema: 200
    short_ema: 21              # 1st zone
    medium_ema: 100            # only used as a zone in loose mode
    donchian_low: 20           # 20-day rolling low zone
    daily_atr_period: 14       # ATR for ATR-scaled zone proximity
    zone_proximity_atr_mult: 0.5   # zone touch: low within +- 0.5 * daily ATR of zone
    zone_lookback_bars: 6      # 1H bars to check for zone touch
  hourly:
    rsi_period: 14
    rsi_threshold: 35          # cross-back-above level
    atr_period: 14
    atr_multiplier_stop: 1.0
    trail_ema: 21              # 1H 21 EMA trail
    take_partial_at_R: 2.0     # +2R partial exit
    partial_exit_pct: 50

costs:
  spread: 0.01
  commission: 0.0
  slippage_ticks: 1
  tick_size: 0.01

execution:
  one_position_at_a_time: true
  no_pyramiding: true
  initial_capital: 10000       # USD; doesn't affect % returns but sets log scale
  risk_pct: 0.01               # 1% of capital per trade

# When running via the entrypoint, both of these modes are executed.
# When running with --mode <name>, only that mode is executed.
modes:
  - strict
  - loose
