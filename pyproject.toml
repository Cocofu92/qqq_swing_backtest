[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qqq_swing_backtest"
version = "0.1.0"
description = "Multi-timeframe trend-pullback backtest on QQQ"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Adam Bates" }]
dependencies = [
    "backtesting>=0.3.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pyarrow>=13.0",
    "requests>=2.31",
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
