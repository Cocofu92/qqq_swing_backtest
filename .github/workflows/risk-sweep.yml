name: Risk-pct + slippage sweep (artefact aggregation)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag for the run"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        risk:
          - {label: "0.5pct", risk_pct: "0.005"}
          - {label: "1pct",   risk_pct: "0.01"}
          - {label: "1.5pct", risk_pct: "0.015"}
          - {label: "2pct",   risk_pct: "0.02"}
          - {label: "2.5pct", risk_pct: "0.025"}
        slippage:
          - {label: "lowslip",  ticks: "1"}
          - {label: "midslip",  ticks: "10"}
          - {label: "highslip", ticks: "50"}

    name: ${{ matrix.risk.label }} ${{ matrix.slippage.label }}
    env:
      FMP_KEY: ${{ secrets.FMP_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Override risk_pct + slippage_ticks
        run: |
          python3 -c "
          from pathlib import Path
          import re
          p = Path('config.yml')
          s = p.read_text()
          s = re.sub(r'  risk_pct: [0-9.]+',
                     '  risk_pct: ${{ matrix.risk.risk_pct }}', s, count=1)
          s = re.sub(r'  slippage_ticks: [0-9.]+',
                     '  slippage_ticks: ${{ matrix.slippage.ticks }}', s, count=1)
          p.write_text(s)
          "
          grep -E "risk_pct:|slippage_ticks:|spread:" config.yml
      - name: Run backtest sweep
        run: |
          mkdir -p outputs
          python -m src.backtest 2>&1 | tee outputs/run.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Stage cell outputs
        if: always()
        run: |
          dest="cell_artefact/${{ matrix.risk.label }}_${{ matrix.slippage.label }}"
          mkdir -p "$dest"
          for d in portfolio_best_return portfolio_best_risk_adjusted; do
            if [ -d "outputs/$d" ]; then cp -r "outputs/$d" "$dest/"; fi
          done
          if [ -f outputs/comparison.md ]; then cp outputs/comparison.md "$dest/"; fi
          if [ -f outputs/run.log ]; then tail -200 outputs/run.log > "$dest/run_tail.log"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cell-${{ matrix.risk.label }}-${{ matrix.slippage.label }}
          path: cell_artefact/
          retention-days: 7

  aggregate:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: cell-*
          merge-multiple: false
      - name: Move into risk_sweep/{ts}/
        run: |
          ts=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          mkdir -p "risk_sweep/${ts}"
          for dir in downloaded/cell-*; do
            for cell in "$dir"/*; do
              if [ -d "$cell" ]; then
                cp -r "$cell" "risk_sweep/${ts}/"
              fi
            done
          done
          ls -la "risk_sweep/${ts}/"
      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add risk_sweep/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "risk-sweep: full matrix ${{ github.event.inputs.tag }}"
            git pull --rebase origin main || true
            git push
          fi
